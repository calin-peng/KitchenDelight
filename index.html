   .overall-content {/*picture on the home page.find anything with the class overall-content and apply the style below*/
    position:fixed;
    top: 45px; /*distance to the top*/
  width: 100%; /*cover the entire width of the screen*/

}
.content-title {
  position: fixed;

  left: 0;

}
.content-image{/*the images of the dished in the content*/

}

/*navigation bar*/

ul {/*the entire list(the style of the bar, not the items inside of it. the structure of a list: <ul><li></li><li></li></ul>*/
  list-style-type: none;/*no bullet point. etc(because navbar is essentially a list)*/
  margin: 0;
  padding: 0; /*the space sround the element*/
  background-color: rgb(2, 153, 153);
  position: fixed;/*will not move even you scroll. static: default. relative: location can be defined, coordinate is relative to the page. absolute: coordinate can be defined but is relative to the closest "relative" element */
  top:0;
  width:100%;
}

li { /*the elements in the lsit(Home, about, etc)*/
  float: left;/*let them arrange horizontally(vertical nav bar does not have this)*/
}

li a, .dropButton {/*"," means or. find all the "a" inside the li and apply this style. find everything with the class gropButton and apply this style*/
  display: inline-block;/*default: inline(inline element, no variation in height and width). block: a block, start a new line, have h and w. inline-block: inline but have h and w.*/
  color: white;
  text-align: center;
  padding: 14px 16px;/*space around the text*/
  text-decoration: none;
}

li a:hover, .dropdown:hover .dropButton {/*apply this style to dropbutton when wither happens: 1. an <a> in the <li> is hovered upon(stir-fry. etc). 2. something with the class dropdown is hovered upon(chinese taste,etc). make sure that the button is darker as long as the cursor is on the menu */
  background-color: #088;
}

li.dropdown {/*apply this style to anyhting that is <li> and have the class dropdown*/
  display: inline-block;/*arrange Home, About... in the inline block format*/
}

.dropdown-content {/*the "container" of the sub types under each cuisine e.x. stir fry .etc*/
  display: none; /*make them invisible for now(until hovered upon)*/
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {/*the sub types under each cuisine e.x. stir fry .etc*/
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {/*if this sub types are hovered upon, their background(container)turn grey*/
    background-color: #ebe8e8;
}

.dropdown:hover .dropdown-content {/*do this to the gropdown-content when the dropdown is hovered upon*/
  display: block;
}

.container{

    display:grid;
    grid-template-columns:300px 300px 300px 300px;

.text-content {

async function showContent(category) {
  const textArea = document.querySelector('#content .text-content');
  const content = categoryContent[category];
  console.log("content =", content);
    console.log("endsWith =", content.endsWith(".html"));
   if (content.endsWith('.html')) {
        const response = await fetch(content);
        textArea.innerHTML = await response.text();
    } else {
        textArea.innerHTML = content;
    }
  document.getElementById('content').style.display = 'block';
  document.querySelector('.overall-content').style.display = 'none';
}

function showHome() {
